<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/Bashist.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      href="/fonts/sk-modernist-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/sk-modernist-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/helvetica-neue-roman.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>Bashist — POSIX & Linux Systems Mastery</title>
    <!-- Prevent theme flashing (anti-FOUC) from dark-mode-design-expert -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("bashist-theme") || localStorage.getItem("linuxdrill-theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          document.documentElement.classList.add(theme, "theme-" + theme);

          var savedPreset = localStorage.getItem("bashist-theme-preset") || localStorage.getItem("linuxdrill-theme-preset") || "default";
          document.documentElement.dataset.themePreset = savedPreset;
          document.documentElement.classList.add("theme-preset-" + savedPreset, "theme-" + savedPreset);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--bg-canvas)] text-[var(--text-main)] font-sans antialiased selection:bg-sky-500/25 selection:text-sky-700 dark:selection:text-sky-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
